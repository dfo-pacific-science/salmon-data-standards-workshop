<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
<title id="title">Workshop workflow: chapter 2</title>
<desc id="desc">Seven stages. Human diagram, dictionary and peer review precede package creation and AI. Publication uses KNB test only.</desc>
<rect width="760" height="590" fill="#ffffff"/>
<rect x="20" y="12" width="720" height="65" rx="9" fill="#f4f5f6" stroke="#687582" stroke-width="1"/>
<text x="40" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#172b3a">1. See the journey</text>
<text x="40" y="61" font-family="sans-serif" font-size="16" fill="#334755">Raw data to test catalog</text>
<text x="715" y="40" text-anchor="end" font-family="sans-serif" font-size="15" fill="#17624d"></text>
<path d="M 380 78 v 12 m -4 -4 l 4 4 l 4 -4" fill="none" stroke="#334755" stroke-width="2"/>
<rect x="20" y="92" width="720" height="65" rx="9" fill="#e2f0eb" stroke="#17624d" stroke-width="3"/>
<text x="40" y="119" font-family="sans-serif" font-size="20" font-weight="bold" fill="#172b3a">2. Draw relationships</text>
<text x="40" y="141" font-family="sans-serif" font-size="16" fill="#334755">Nodes, edges, row meaning</text>
<text x="715" y="120" text-anchor="end" font-family="sans-serif" font-size="15" fill="#17624d">Current chapter</text>
<path d="M 380 158 v 12 m -4 -4 l 4 4 l 4 -4" fill="none" stroke="#334755" stroke-width="2"/>
<rect x="20" y="172" width="720" height="65" rx="9" fill="#f4f5f6" stroke="#687582" stroke-width="1"/>
<text x="40" y="199" font-family="sans-serif" font-size="20" font-weight="bold" fill="#172b3a">3. Describe and review</text>
<text x="40" y="221" font-family="sans-serif" font-size="16" fill="#334755">Dictionary and decomposition</text>
<text x="715" y="200" text-anchor="end" font-family="sans-serif" font-size="15" fill="#17624d"></text>
<path d="M 380 238 v 12 m -4 -4 l 4 4 l 4 -4" fill="none" stroke="#334755" stroke-width="2"/>
<rect x="20" y="252" width="720" height="65" rx="9" fill="#f4f5f6" stroke="#687582" stroke-width="1"/>
<text x="40" y="279" font-family="sans-serif" font-size="20" font-weight="bold" fill="#172b3a">4. Build the package</text>
<text x="40" y="301" font-family="sans-serif" font-size="16" fill="#334755">Human work into SDP files</text>
<text x="715" y="280" text-anchor="end" font-family="sans-serif" font-size="15" fill="#17624d"></text>
<path d="M 380 318 v 12 m -4 -4 l 4 4 l 4 -4" fill="none" stroke="#334755" stroke-width="2"/>
<rect x="20" y="332" width="720" height="65" rx="9" fill="#f4f5f6" stroke="#687582" stroke-width="1"/>
<text x="40" y="359" font-family="sans-serif" font-size="20" font-weight="bold" fill="#172b3a">5. Map and evaluate AI</text>
<text x="40" y="381" font-family="sans-serif" font-size="16" fill="#334755">Evidence and recorded decisions</text>
<text x="715" y="360" text-anchor="end" font-family="sans-serif" font-size="15" fill="#17624d"></text>
<path d="M 380 398 v 12 m -4 -4 l 4 4 l 4 -4" fill="none" stroke="#334755" stroke-width="2"/>
<rect x="20" y="412" width="720" height="65" rx="9" fill="#f4f5f6" stroke="#687582" stroke-width="1"/>
<text x="40" y="439" font-family="sans-serif" font-size="20" font-weight="bold" fill="#172b3a">6. Document codes</text>
<text x="40" y="461" font-family="sans-serif" font-size="16" fill="#334755">Methods and local/shared gaps</text>
<text x="715" y="440" text-anchor="end" font-family="sans-serif" font-size="15" fill="#17624d"></text>
<path d="M 380 478 v 12 m -4 -4 l 4 4 l 4 -4" fill="none" stroke="#334755" stroke-width="2"/>
<rect x="20" y="492" width="720" height="65" rx="9" fill="#f4f5f6" stroke="#687582" stroke-width="1"/>
<text x="40" y="519" font-family="sans-serif" font-size="20" font-weight="bold" fill="#172b3a">7. Validate and rehearse</text>
<text x="40" y="541" font-family="sans-serif" font-size="16" fill="#334755">EML and KNB test only</text>
<text x="715" y="520" text-anchor="end" font-family="sans-serif" font-size="15" fill="#17624d"></text>
